<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Face Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed camera stage, one tool rail pinned to the bottom edge */
:root{
  --ground:#101214;
  --panel:#1a1d20;
  --line:#2c3136;
  --ink:#e9ecee;
  --muted:#8b949c;
  --accent:#ff4d6d;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}

#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
#view{display:block;touch-action:none;cursor:crosshair;background:#000}

#status{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line);background:color-mix(in srgb,var(--ground) 80%,transparent);display:flex;gap:8px;align-items:center}
#status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#status.ok i{background:#3ddc84}
#status.warn i{background:#ffb020}

#start{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
#start .card{max-width:30rem;border:1px solid var(--line);background:var(--panel);padding:24px;display:grid;gap:14px}
#start h1{margin:0;font:600 22px/1.2 var(--sans);text-wrap:balance}
#start p{margin:0;color:var(--muted)}
#start .err{color:#ffb020}

#bar{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.group{display:flex;align-items:center;gap:8px}
.label{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;outline-offset:2px}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
input[type=range]{width:110px;accent-color:var(--accent)}
#sizeOut{font:500 12px/1 var(--mono);width:3ch;font-variant-numeric:tabular-nums}
button.tool{font:500 12px/1 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);padding:9px 12px;cursor:pointer}
button.tool:hover{border-color:var(--muted)}
button.tool[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button.primary{font:600 14px/1 var(--sans);color:#fff;background:var(--accent);border:0;padding:12px 16px;cursor:pointer;justify-self:start}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
@media (max-width:560px){.spacer{display:none}input[type=range]{width:90px}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="view" width="1280" height="720"></canvas>
  <div id="status"><i></i><span id="statusText">Camera off</span></div>
  <div id="start">
    <div class="card">
      <h1>Draw on a face. It stays there.</h1>
      <p>Point the camera at a face, looking straight on. Strokes are pinned to the face mesh, so they move, scale and turn with the head.</p>
      <p id="startErr" class="err" hidden></p>
      <button class="primary" id="startBtn">Start camera</button>
    </div>
  </div>
</div>

<div id="bar">
  <div class="group" id="swatches" role="group" aria-label="Colour"></div>
  <div class="group">
    <label class="label" for="size">Size</label>
    <input id="size" type="range" min="2" max="40" value="8">
    <span id="sizeOut">8</span>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button class="tool" id="holdBtn" aria-pressed="false" title="Freeze the frame while you draw">Hold frame</button>
    <button class="tool" id="meshBtn" aria-pressed="false">Mesh</button>
    <button class="tool" id="flipBtn">Flip camera</button>
  </div>
  <div class="group">
    <button class="tool" id="undoBtn">Undo</button>
    <button class="tool" id="clearBtn" title="Remove all strokes and rescan the face">Clear</button>
    <button class="tool" id="snapBtn">Save PNG</button>
  </div>
</div>

<video id="video" playsinline muted hidden></video>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import Delaunator from "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm";

/* ---------- Settings ---------- */
const MESH_N = 468;            // face mesh points (iris points 468-477 excluded)
const FOLLOW = 0.65;           // landmark smoothing: 1 = raw, lower = steadier but laggier
const HIDE_BELOW = 0.2;        // hide stroke points on triangles squashed below 20% of their front-on area
const COLOURS = ["#ff4d6d","#ffd23f","#3ddc84","#3fa7ff","#ffffff","#111111"];
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

/* ---------- Elements ---------- */
const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("view"), ctx = canvas.getContext("2d");
const frame = document.createElement("canvas"), fctx = frame.getContext("2d");
const stage = $("stage");

/* ---------- State ---------- */
const S = {
  landmarker: null, stream: null, facing: "user",
  W: 1280, H: 720, lastTime: -1,
  lm: null,            // Float32Array [x0,y0,x1,y1,...] in video pixels
  tris: null,          // Uint32Array of triangle vertex indices
  refSign: null,       // Int8Array: winding of each triangle when front-on
  refArea: null,       // Float32Array: area / scale^2 when front-on
  scale: 1,            // current face scale (outer eye corner distance)
  tracking: false, hold: false, showMesh: false,
  colour: COLOURS[0], size: 8,
  strokes: [], current: null,
};

/* ---------- Stage 1: Camera ---------- */
async function startCamera() {
  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  S.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: S.facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = S.stream;
  await video.play();
  S.W = video.videoWidth; S.H = video.videoHeight;
  canvas.width = frame.width = S.W;
  canvas.height = frame.height = S.H;
  S.lastTime = -1;
  layout();
}

function layout() {
  const r = stage.getBoundingClientRect();
  const s = Math.min(r.width / S.W, r.height / S.H);
  canvas.style.width = Math.floor(S.W * s) + "px";
  canvas.style.height = Math.floor(S.H * s) + "px";
}
addEventListener("resize", layout);

/* ---------- Stage 2: Tracker ---------- */
async function startTracker() {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO", numFaces: 1,
  });
  try { S.landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch { S.landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
}

function updateLandmarks(face) {
  const { W, H } = S;
  if (!S.lm) {
    S.lm = new Float32Array(MESH_N * 2);
    for (let i = 0; i < MESH_N; i++) { S.lm[2*i] = face[i].x * W; S.lm[2*i+1] = face[i].y * H; }
  } else {
    for (let i = 0; i < MESH_N; i++) {
      S.lm[2*i]   += FOLLOW * (face[i].x * W - S.lm[2*i]);
      S.lm[2*i+1] += FOLLOW * (face[i].y * H - S.lm[2*i+1]);
    }
  }
  S.scale = Math.hypot(S.lm[33*2] - S.lm[263*2], S.lm[33*2+1] - S.lm[263*2+1]) || 1;
  if (!S.tris) buildMesh();
}

/* ---------- Stage 3: Mesh (built once, from the first front-on frame) ---------- */
function buildMesh() {
  const d = new Delaunator(Float64Array.from(S.lm));
  S.tris = d.triangles;
  const n = S.tris.length / 3;
  S.refSign = new Int8Array(n);
  S.refArea = new Float32Array(n);
  const s2 = S.scale * S.scale;
  for (let t = 0; t < n; t++) {
    const a = signedArea(t);
    S.refSign[t] = a >= 0 ? 1 : -1;
    S.refArea[t] = Math.abs(a) / s2;
  }
}

function signedArea(t) {
  const L = S.lm, T = S.tris;
  const a = T[3*t], b = T[3*t+1], c = T[3*t+2];
  return (L[2*b] - L[2*a]) * (L[2*c+1] - L[2*a+1]) - (L[2*c] - L[2*a]) * (L[2*b+1] - L[2*a+1]);
}

// A triangle is visible if it still faces the camera and is not squashed edge-on
function triVisible(t) {
  const a = signedArea(t) * S.refSign[t];
  return a > 0 && a / (S.scale * S.scale) > HIDE_BELOW * S.refArea[t];
}

/* ---------- Stage 4: Bind (screen point -> triangle + barycentric weights) ---------- */
function bind(px, py) {
  const L = S.lm, T = S.tris, n = T.length / 3;
  let best = -1, bestScore = Infinity, bu = 0, bv = 0;
  for (let t = 0; t < n; t++) {
    if (!triVisible(t)) continue;
    const a = T[3*t], b = T[3*t+1], c = T[3*t+2];
    const ax = L[2*a], ay = L[2*a+1], bx = L[2*b], by = L[2*b+1], cx = L[2*c], cy = L[2*c+1];
    const d = (by - cy) * (ax - cx) + (cx - bx) * (ay - cy);
    if (Math.abs(d) < 1e-6) continue;
    const u = ((by - cy) * (px - cx) + (cx - bx) * (py - cy)) / d;
    const v = ((cy - ay) * (px - cx) + (ax - cx) * (py - cy)) / d;
    const w = 1 - u - v;
    const score = Math.max(0, -Math.min(u, v, w));   // 0 = inside; otherwise how far outside
    if (score < bestScore) { bestScore = score; best = t; bu = u; bv = v; if (score === 0) break; }
  }
  return best < 0 ? null : { t: best, u: bu, v: bv };
}

// Triangle + weights -> current screen point (null if that part of the face is turned away)
function project(p) {
  if (!triVisible(p.t)) return null;
  const L = S.lm, T = S.tris, w = 1 - p.u - p.v;
  const a = T[3*p.t], b = T[3*p.t+1], c = T[3*p.t+2];
  return [p.u * L[2*a] + p.v * L[2*b] + w * L[2*c], p.u * L[2*a+1] + p.v * L[2*b+1] + w * L[2*c+1]];
}

/* ---------- Stage 5: Draw input ---------- */
const mirrored = () => S.facing === "user";

function toVideoSpace(e) {
  const r = canvas.getBoundingClientRect();
  let x = (e.clientX - r.left) / r.width * S.W;
  const y = (e.clientY - r.top) / r.height * S.H;
  if (mirrored()) x = S.W - x;
  return [x, y];
}

canvas.addEventListener("pointerdown", e => {
  if (!S.tracking || !S.tris) return;
  canvas.setPointerCapture(e.pointerId);
  const [x, y] = toVideoSpace(e);
  const p = bind(x, y);
  if (!p) return;
  S.current = { colour: S.colour, size: S.size * (S.W / 1280), scale: S.scale, pts: [p], last: [x, y] };
  S.strokes.push(S.current);
});

canvas.addEventListener("pointermove", e => {
  if (!S.current || !S.tracking) return;
  const [x, y] = toVideoSpace(e);
  const [lx, ly] = S.current.last;
  if (Math.hypot(x - lx, y - ly) < 1.5) return;
  const p = bind(x, y);
  if (p) { S.current.pts.push(p); S.current.last = [x, y]; }
});

const endStroke = () => { S.current = null; };
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

/* ---------- Stage 6: Render ---------- */
function render() {
  const { W, H } = S;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (mirrored()) ctx.setTransform(-1, 0, 0, 1, W, 0);
  ctx.drawImage(frame, 0, 0, W, H);
  if (!S.tracking || !S.tris) return;

  if (S.showMesh) {
    ctx.lineWidth = Math.max(0.5, W / 2000);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    const L = S.lm, T = S.tris;
    for (let t = 0; t < T.length / 3; t++) {
      if (!triVisible(t)) continue;
      const a = T[3*t], b = T[3*t+1], c = T[3*t+2];
      ctx.moveTo(L[2*a], L[2*a+1]); ctx.lineTo(L[2*b], L[2*b+1]); ctx.lineTo(L[2*c], L[2*c+1]); ctx.closePath();
    }
    ctx.stroke();
  }

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const s of S.strokes) {
    const width = s.size * (S.scale / s.scale);
    ctx.strokeStyle = ctx.fillStyle = s.colour;
    ctx.lineWidth = width;
    if (s.pts.length === 1) {
      const q = project(s.pts[0]);
      if (q) { ctx.beginPath(); ctx.arc(q[0], q[1], width / 2, 0, Math.PI * 2); ctx.fill(); }
      continue;
    }
    ctx.beginPath();
    let down = false;
    for (const p of s.pts) {
      const q = project(p);
      if (!q) { down = false; continue; }
      if (down) ctx.lineTo(q[0], q[1]); else { ctx.moveTo(q[0], q[1]); down = true; }
    }
    ctx.stroke();
  }
}

/* ---------- Loop ---------- */
function loop() {
  if (!S.hold && video.readyState >= 2 && video.currentTime !== S.lastTime) {
    S.lastTime = video.currentTime;
    fctx.drawImage(video, 0, 0, S.W, S.H);
    const res = S.landmarker.detectForVideo(video, performance.now());
    const face = res.faceLandmarks && res.faceLandmarks[0];
    if (face) { updateLandmarks(face); S.tracking = true; }
    else S.tracking = false;
  }
  setStatus();
  render();
  requestAnimationFrame(loop);
}

let lastStatus = "";
function setStatus() {
  const text = S.hold ? "Frame held" : S.tracking ? "Face locked" : "Looking for a face";
  if (text === lastStatus) return;
  lastStatus = text;
  $("statusText").textContent = text;
  $("status").className = S.tracking ? "ok" : "warn";
}

/* ---------- Controls ---------- */
for (const c of COLOURS) {
  const b = document.createElement("button");
  b.className = "swatch"; b.style.background = c;
  b.setAttribute("aria-label", "Colour " + c);
  b.setAttribute("aria-pressed", String(c === S.colour));
  b.onclick = () => {
    S.colour = c;
    document.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  };
  $("swatches").append(b);
}
$("size").oninput = e => { S.size = +e.target.value; $("sizeOut").textContent = S.size; };

$("holdBtn").onclick = e => { S.hold = !S.hold; e.target.setAttribute("aria-pressed", String(S.hold)); };
$("meshBtn").onclick = e => { S.showMesh = !S.showMesh; e.target.setAttribute("aria-pressed", String(S.showMesh)); };
$("undoBtn").onclick = () => { S.strokes.pop(); S.current = null; };
$("clearBtn").onclick = () => { S.strokes = []; S.current = null; S.lm = null; S.tris = null; };
$("flipBtn").onclick = async () => {
  S.facing = S.facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (err) { showError("Could not switch camera: " + err.message); }
};
$("snapBtn").onclick = () => {
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "face-mark-" + Date.now() + ".png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
};

function showError(msg) { const el = $("startErr"); el.textContent = msg; el.hidden = false; $("start").hidden = false; }

$("startBtn").onclick = async () => {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    showError("The camera needs a secure page. Open this file via http://localhost or an https:// address.");
    return;
  }
  $("startBtn").disabled = true;
  $("startBtn").textContent = "Loading face tracker…";
  try {
    await Promise.all([startCamera(), startTracker()]);
    $("start").hidden = true;
    requestAnimationFrame(loop);
  } catch (err) {
    $("startBtn").disabled = false;
    $("startBtn").textContent = "Try again";
    showError(err.name === "NotAllowedError" ? "Camera permission was refused. Allow it in the browser and try again." : "Could not start: " + err.message);
  }
};
</script>
</body>
</html>
